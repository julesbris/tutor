# Quest Lab — nginx site
#
# Install to /etc/nginx/sites-available/questlab and symlink into sites-enabled.
# Replace YOUR_DOMAIN below (setup-server.sh does this for you).
#
# Run certbot afterwards and it will rewrite this file to add the HTTPS server
# block and the port 80 redirect:
#     certbot --nginx -d YOUR_DOMAIN

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    # Kids answering a quiz never upload anything big.
    client_max_body_size 2m;

    # Static files come straight off disk, not through Python.
    location /static/ {
        alias /opt/questlab/app/static/;
        expires 7d;
        access_log off;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Don't let the health check clutter the access log.
    location = /healthz {
        access_log off;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header Referrer-Policy        "same-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json;
}
