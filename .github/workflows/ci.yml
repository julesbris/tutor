name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: questlab
          POSTGRES_PASSWORD: questlab
          POSTGRES_DB: questlab
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://questlab:questlab@localhost:5432/questlab
      SECRET_KEY: ci-only-not-a-real-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate the content packs
        run: python validate_content.py

      - name: Load the content into Postgres
        run: python seed.py --reset

      - name: End-to-end smoke test
        run: python smoke_test.py
